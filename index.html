<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madhav Karbhari - Apex Rise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 20px;
            overflow-x: hidden;
        }

        .instruction {
            color: #c9a961;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .card-container {
            perspective: 1500px;
            width: 100%;
            max-width: 650px;
            height: 400px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #fdfbf7 0%, #f5f3ed 100%);
            border: 3px solid #c9a961;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-front {
            justify-content: center;
        }

        .card-back {
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            margin-bottom: 0;
            min-height: 200px;
        }

        .logo {
            width: 280px;
            height: 280px;
            position: relative;
            flex-shrink: 0;
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        .brand {
            flex: 1;
            text-align: left;
        }

        .brand-name {
            font-size: 2.8rem;
            font-weight: 700;
            color: #c9a961;
            letter-spacing: 4px;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .tagline {
            font-size: 1rem;
            color: #8b7355;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #c9a961, transparent);
            margin: 25px 0;
        }

        .owner-info {
            text-align: left;
        }

        .owner-name {
            font-size: 1.8rem;
            font-weight: 600;
            color: #8b7355;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .owner-title {
            font-size: 1rem;
            color: #c9a961;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .segments {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0d7c6;
        }

        .segments-title {
            font-size: 0.85rem;
            color: #8b7355;
            margin-bottom: 12px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .segment-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .segment-item {
            color: #2d2d2d;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .segment-item::before {
            content: "●";
            color: #c9a961;
            font-size: 0.6rem;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #1a1a2e;
        }

        .contact-icon {
            width: 40px;
            height: 40px;
            background: #c9a961;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .contact-icon svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .contact-text {
            font-size: 1rem;
            color: #2d2d2d;
            word-break: break-all;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            background: #c9a961;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s, background 0.3s;
            cursor: pointer;
        }

        .social-icon:hover {
            transform: scale(1.1);
            background: #8b7355;
        }

        .social-icon svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        @media (max-width: 640px) {
            .card-container {
                max-width: 100%;
                height: 500px;
            }

            .card-face {
                padding: 30px;
            }

            .logo-section {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 20px;
            }

            .brand-name {
                font-size: 1.8rem;
            }

            .owner-name {
                font-size: 1.5rem;
            }

            .owner-info {
                text-align: center;
            }

            .contact-text {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .brand-name {
                font-size: 1.5rem;
            }

            .logo {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <script>
        function flipCard() {
            const card = document.getElementById('businessCard');
            card.classList.toggle('flipped');
        }

        // Add touch support for mobile
        let touchStartX = 0;
        let touchEndX = 0;

        const cardContainer = document.querySelector('.card-container');

        cardContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        cardContainer.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            if (Math.abs(touchEndX - touchStartX) < 10) {
                flipCard();
            }
        });
    </script>
